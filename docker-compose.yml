services:
  db:
    image: postgres:16
    container_name: tchuno_db
    environment:
      POSTGRES_USER: tchuno
      POSTGRES_PASSWORD: tchuno
      POSTGRES_DB: tchuno
    ports:
      - "5432:5432"
    volumes:
      - tchuno_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tchuno -d tchuno"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://tchuno:tchuno@db:5432/tchuno?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "corepack yarn workspace @tchuno/database prisma migrate deploy &&
      corepack yarn workspace @tchuno/database prisma db seed"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://tchuno:tchuno@db:5432/tchuno?schema=public
      JWT_ACCESS_SECRET: local-dev-access-secret-for-compose-only-32-chars
      JWT_REFRESH_SECRET: local-dev-refresh-secret-for-compose-only-32-chars
      WEB_ORIGIN: http://localhost:3000
      PAYMENT_DEFAULT_PROVIDER: INTERNAL
      PAYMENT_WEBHOOK_SECRET: local-dev-webhook-secret-for-compose-only-32-chars
      PAYMENT_WEBHOOK_SECRET_MPESA: local-dev-mpesa-webhook-secret-for-compose-only
      PAYMENT_WEBHOOK_SECRET_EMOLA: local-dev-emola-webhook-secret-for-compose-only
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/observability/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tchuno_db_data:
